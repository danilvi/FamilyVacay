    /* SAVE */

    .save-area {

    .save-button {

      height: 100%;

    }

    .votes-list {
      display: flex;

    .vote-row {

    /* CONNECTION */

    .connection {

      width: 8px;

    .connection.offline .connection-dot {
      background: #e05252;
    }

    /* MOBILE */

    @media (max-width: 720px) {
      .container {
        width: min(100% - 20px, 600px);
      }

      .hero {
        padding-top: 28px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {

      }

      .destinations,
      .results-grid {

      .destination-image {

      }

        font-size: 34px;

      .winner {
        padding: 22px;
      }

      .winner-name {
        font-size: 30px;
      }

      .save-button {
        width: 100%;
      }

      .connection {
        bottom: 10px;
        left: 10px;
      }
    }

    @media (max-width: 380px) {
      .star {
        font-size: 29px;
      }

      .destination-content {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="container">
      <div class="hero-icon">✈️</div>
      <h1>לאן נוסעים לחופשה?</h1>
      <p>
        כל אחד מבני המשפחה מדרג את היעדים האהובים עליו,
        וביחד נגלה מהו היעד המנצח 🏆
      </p>
    </div>
  </header>

  <main class="container">

    <!-- NAME -->
    <section class="name-card">
      <label class="name-label" for="familyName">
        👤 שם בן/בת המשפחה <span class="required">*</span>
      </label>

      <input
        id="familyName"
        class="name-input"
        type="text"
        maxlength="40"
        autocomplete="name"
        placeholder="לדוגמה: דני"
      >
    </section>

    <!-- DESTINATIONS -->
    <section>
      <div class="section-title">
        <h2>🌍 דירוג היעדים</h2>
        <span>1 = פחות מתאים · 5 = חלום!</span>
      </div>

      <div id="destinations" class="destinations"></div>
    </section>

    <!-- SAVE -->
    <div class="save-area">
      <button id="saveButton" class="save-button">
        💾 שמור את הדירוג שלי
      </button>

      <div id="saveStatus" class="save-status"></div>
    </div>

    <!-- RESULTS -->
    <section class="results-section">
      <div class="results-header">
        <h2>📊 תוצאות המשפחה</h2>
        <p>הנתונים מתעדכנים אוטומטית אצל כולם בזמן אמת.</p>
      </div>

      <div id="winner"></div>

      <div id="resultsGrid" class="results-grid"></div>
    </section>

  </main>

  <div id="connection" class="connection">
    <span class="connection-dot"></span>
    <span id="connectionText">מתחבר...</span>
  </div>


  <!--
    ==========================================================
    FIREBASE
    ==========================================================
    Firebase SDK 10.12.2
  -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      onValue
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /*
      ========================================================
      1. הדבק כאן את פרטי Firebase שלך
      ========================================================

      Firebase Console
      -> Project settings
      -> Your apps
      -> Web app

      העתק את אובייקט firebaseConfig שקיבלת.
    */

   const firebaseConfig = {
  apiKey: "AIzaSyCzD6nXbJ68MnLhSjse9gSwDpOlL-0Yr-0",
  authDomain: "family-vacation-e955e.firebaseapp.com",
  projectId: "family-vacation-e955e",
  storageBucket: "family-vacation-e955e.firebasestorage.app",
  messagingSenderId: "18977724886",
  appId: "1:18977724886:web:db14c954ba0dcf52bbac77",
  measurementId: "G-WL63PGF3WX"
};


    /*
      ========================================================
      2. INITIALIZE FIREBASE
      ========================================================
    */

    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);

    /*
      כל ההצבעות נשמרות תחת:
      vacationPoll/votes
    */

    const votesRef = ref(database, "vacationPoll/votes");


    /*
      ========================================================
      3. DESTINATIONS
      ========================================================
    */

    const destinations = [
      {
        id: "eilat",
        name: "אילת",
        emoji: "🌴",
        description: "ים, בריכה, שמש ואטרקציות לכל המשפחה.",
        image:
          "https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=1200&q=85"
      },

      {
        id: "greece",
        name: "יוון",
        emoji: "🇬🇷",
        description: "חופים יפים, אוכל מעולה ואווירה ים־תיכונית.",
        image:
          "https://images.unsplash.com/photo-1603565816030-6b389eeb23cb?auto=format&fit=crop&w=1200&q=85"
      },

      {
        id: "thailand",
        name: "תאילנד",
        emoji: "🇹🇭",
        description: "איים טרופיים, טבע, ים וחוויה משפחתית מיוחדת.",
        image:
          "https://images.unsplash.com/photo-1528181304800-259b08848526?auto=format&fit=crop&w=1200&q=85"
      },

      {
        id: "ski",
        name: "חופשת סקי",
        emoji: "⛷️",
        description: "שלג, הרים, סקי והרבה אקשן לכל המשפחה.",
        image:
          "https://images.unsplash.com/photo-1551524559-8af4e6624178?auto=format&fit=crop&w=1200&q=85"
      }
    ];


    /*
      ========================================================
      4. LOCAL STATE
      ========================================================
    */

    let currentRatings = {};

    let allVotes = {};


    /*
      ========================================================
      5. RENDER DESTINATION CARDS
      ========================================================
    */

    function renderDestinations() {

      const container = document.getElementById("destinations");

      container.innerHTML = destinations.map(destination => {

        const rating = currentRatings[destination.id] || 0;

        return `
          <article
            class="destination-card ${rating ? "selected" : ""}"
            id="card-${destination.id}"
          >

            <img
              class="destination-image"
              src="${destination.image}"
              alt="${destination.name}"
              loading="lazy"
            >

            <div class="destination-content">

              <div class="destination-top">
                <h3 class="destination-name">
                  ${destination.emoji} ${destination.name}
                </h3>
              </div>

              <p class="destination-description">
                ${destination.description}
              </p>

              <div class="rating-label">
                כמה הייתם רוצים לנסוע לשם?
              </div>

              <div
                class="stars"
                data-destination="${destination.id}"
              >

                ${[1,2,3,4,5].map(number => `
                  <button
                    type="button"
                    class="star ${number <= rating ? "active" : ""}"
                    data-rating="${number}"
                    aria-label="${number} כוכבים"
                  >
                    ★
                  </button>
                `).join("")}

              </div>

              <div class="rating-value">
                ${rating
                  ? `הדירוג שלך: ${rating} מתוך 5`
                  : "עדיין לא דירגת"}
              </div>

            </div>

          </article>
        `;

      }).join("");

      /*
        Attach star click handlers
      */

      document
        .querySelectorAll(".stars")
        .forEach(starsContainer => {

          starsContainer.addEventListener("click", event => {

            const star = event.target.closest(".star");

            if (!star) return;

            const destinationId =
              starsContainer.dataset.destination;

            const rating =
              Number(star.dataset.rating);

            currentRatings[destinationId] = rating;

            renderDestinations();

          });

        });

    }


    /*
      ========================================================
      6. SAVE VOTE
      ========================================================
    */

    async function saveVote() {

      const nameInput =
        document.getElementById("familyName");

      const status =
        document.getElementById("saveStatus");

      const button =
        document.getElementById("saveButton");

      const name =
        nameInput.value.trim();


      /*
        Validation
      */

      if (!name) {

        status.className = "save-status error";

        status.textContent =
          "נא להזין את שם בן/בת המשפחה.";

        nameInput.focus();

        return;
      }


      const ratingsCount =
        Object.keys(currentRatings).length;


      if (ratingsCount === 0) {

        status.className = "save-status error";

        status.textContent =
          "נא לבחור לפחות יעד אחד ולדרג אותו.";

        return;
      }


      /*
        Clean name so it can safely be used as a Firebase key.
      */

      const safeName =
        name
          .replace(/[.#$[\]/]/g, "-")
          .trim();


      button.disabled = true;

      status.className = "save-status";

      status.textContent =
        "שומר את הדירוג...";


      try {

        /*
          IMPORTANT:
          Each family member has one record.

          Saving again with the same name updates
          that person's previous vote.
        */

        const userVoteRef =
          ref(
            database,
            `vacationPoll/votes/${safeName}`
          );


        await set(userVoteRef, {

          displayName: name,

          ratings: currentRatings,

          updatedAt: Date.now()

        });


        status.className =
          "save-status success";

        status.textContent =
          "✅ הדירוג נשמר בהצלחה!";


        /*
          Small visual confirmation
        */

        setTimeout(() => {

          status.textContent =
            "הנתונים מסתנכרנים עם שאר המשפחה בזמן אמת.";

        }, 2000);


      } catch (error) {

        console.error(error);

        status.className =
          "save-status error";

        status.textContent =
          "❌ לא הצלחנו לשמור. בדקו את הגדרות Firebase.";

      } finally {

        button.disabled = false;

      }

    }


    /*
      ========================================================
      7. REAL-TIME DATABASE LISTENER
      ========================================================
    */

    onValue(
      votesRef,
      snapshot => {

        const data =
          snapshot.val();

        allVotes =
          data || {};

        renderResults();

        setConnectionStatus(true);

      },
      error => {

        console.error(
          "Firebase realtime error:",
          error
        );

        setConnectionStatus(false);

      }
    );


    /*
      ========================================================
      8. RENDER RESULTS
      ========================================================
    */

    function renderResults() {

      const resultsGrid =
        document.getElementById("resultsGrid");

      const winnerContainer =
        document.getElementById("winner");


      /*
        Calculate statistics
      */

      const statistics =
        destinations.map(destination => {

          const votes = [];

          Object.values(allVotes).forEach(person => {

            if (
              person &&
              person.ratings &&
              typeof person.ratings[destination.id] === "number"
            ) {

              votes.push({
                name: person.displayName || "משתמש",
                rating: person.ratings[destination.id]
              });

            }

          });


          const average =
            votes.length
              ? votes.reduce(
                  (sum, vote) => sum + vote.rating,
                  0
                ) / votes.length
              : 0;


          return {
            ...destination,
            votes,
            average
          };

        });


      /*
        Determine winner
      */

      const votedDestinations =
        statistics.filter(item => item.votes.length > 0);


      if (votedDestinations.length === 0) {

        winnerContainer.innerHTML = `
          <div class="winner">
            <div class="winner-label">
              🏆 המקום הראשון
            </div>

            <div class="winner-name">
              עדיין אין דירוגים
            </div>

            <div class="winner-score">
              היו הראשונים להצביע!
            </div>
          </div>
        `;

      } else {

        /*
          Highest average wins.
          If tied, the destination with more votes wins.
        */

        const sorted =
          [...votedDestinations].sort((a, b) => {

            if (b.average !== a.average) {
              return b.average - a.average;
            }

            return b.votes.length - a.votes.length;

          });


        const winner =
          sorted[0];


        winnerContainer.innerHTML = `
          <div class="winner">

            <div class="winner-label">
              🏆 המקום הראשון כרגע
            </div>

            <div class="winner-name">
              ${winner.emoji} ${winner.name}
            </div>

            <div class="winner-score">
              ⭐ ${winner.average.toFixed(2)}
              מתוך 5
              · ${winner.votes.length} הצבעות
            </div>

          </div>
        `;

      }


      /*
        Render all destination statistics
      */

      resultsGrid.innerHTML =
        statistics.map(item => {

          const percentage =
            item.average
              ? (item.average / 5) * 100
              : 0;


          const votesHtml =
            item.votes.length

              ? item.votes
                  .sort((a, b) => b.rating - a.rating)
                  .map(vote => `
                    <div class="vote-row">

                      <span>
                        ${escapeHtml(vote.name)}
                      </span>

                      <span class="vote-stars">
                        ${"★".repeat(vote.rating)}
                        <span style="color:#cfd3dd">
                          ${"★".repeat(5 - vote.rating)}
                        </span>
                      </span>

                    </div>
                  `)
                  .join("")

              : `
                  <div class="no-votes">
                    עדיין אין הצבעות ליעד הזה
                  </div>
                `;


          return `
            <article class="result-card">

              <div class="result-title">

                <h3>
                  ${item.emoji} ${item.name}
                </h3>

                <div class="average">
                  ${
                    item.average
                      ? item.average.toFixed(2)
                      : "—"
                  }
                  ⭐
                </div>

              </div>

              <div class="result-bar">
                <div
                  class="result-bar-fill"
                  style="width:${percentage}%"
                ></div>
              </div>

              <div class="votes-list">
                ${votesHtml}
              </div>

            </article>
          `;

        }).join("");

    }


    /*
      ========================================================
      9. ESCAPE HTML
      ========================================================
      Prevents a person's name from being interpreted as HTML.
    */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      ========================================================
      10. CONNECTION STATUS
      ========================================================
    */

    function setConnectionStatus(online) {

      const connection =
        document.getElementById("connection");

      const text =
        document.getElementById("connectionText");


      if (online) {

        connection.classList.remove("offline");

        text.textContent =
          "מחובר ומתעדכן בזמן אמת";

      } else {

        connection.classList.add("offline");

        text.textContent =
          "אין חיבור למסד הנתונים";

      }

    }


    /*
      ========================================================
      11. BUTTON
      ========================================================
    */

    document
      .getElementById("saveButton")
      .addEventListener("click", saveVote);


    /*
      ========================================================
      12. INITIAL RENDER
      ========================================================
    */

    renderDestinations();

    renderResults();


    /*
      Allow Enter in name field to focus the destinations.
    */

    document
      .getElementById("familyName")
      .addEventListener("keydown", event => {

        if (event.key === "Enter") {

          document
            .getElementById("destinations")
            .scrollIntoView({
              behavior: "smooth"
            });

        }

      });

  </script>

</body>
</html>
